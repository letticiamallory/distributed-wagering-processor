name: distributed-wagering-processor

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Cria o banco de testes (wallet_test) quando o volume nasce.
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-create-test-db.sql:ro
    healthcheck:
      # -h 127.0.0.1 força TCP: num volume NOVO o servidor temporário da inicialização só escuta no
      # socket Unix, e sem o -h o healthcheck ficaria verde antes de a porta 5432 existir.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U wallet -d wallet"]
      interval: 5s
      timeout: 3s
      # O primeiro boot (volume vazio: initdb, o banco de testes e o checkpoint de shutdown do
      # servidor temporário) levou 59 s no Docker Desktop do Windows. Falhas dentro do
      # start_period não contam: a paciência total é 120 s + 10 x 5 s = 170 s. Num boot com o
      # volume já criado o check fica verde em segundos e o start_period não atrasa nada.
      start_period: 120s
      start_interval: 2s
      retries: 10

  sqs:
    image: ministackorg/ministack
    ports:
      - "4566:4566"
    # A imagem não tem curl nem wget, mas tem Python.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health', timeout=3)"
      interval: 5s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
      retries: 10

  # Roda uma vez, cria as filas e termina.
  queues-init:
    image: amazon/aws-cli
    entrypoint: ["sh"]
    command: ["/scripts/init-queues.sh"]
    environment:
      SQS_ENDPOINT: http://sqs:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./scripts:/scripts:ro
    depends_on:
      sqs:
        condition: service_healthy
    restart: "no"

  # Roda uma vez: aplica as migrations (o schema) antes de a app subir. Sem isso um banco novo não
  # tem tabela nenhuma. Rodar de novo é seguro (o que já foi aplicado é pulado).
  migrate:
    build: .
    command: ["bun", "src/infrastructure/persistence/run-migrations.ts"]
    environment:
      DATABASE_URL: postgres://wallet:wallet@postgres:5432/wallet
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://wallet:wallet@postgres:5432/wallet
      SQS_ENDPOINT: http://sqs:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      # Quanto esperar por uma conexão livre do pool antes do 503 (ADR-0007). Dá para trocar na
      # subida, para refazer a tabela do ARCHITECTURE.md: DB_ACQUIRE_TIMEOUT_MS=1000 docker compose up -d
      DB_ACQUIRE_TIMEOUT_MS: ${DB_ACQUIRE_TIMEOUT_MS:-3000}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      queues-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    # A imagem não tem curl; o próprio Bun faz a requisição. Falha (exit 1) se não for 2xx.
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "const r = await fetch('http://localhost:3000/health/live'); process.exit(r.ok ? 0 : 1)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    # Tempo para o SIGTERM terminar as mensagens em andamento.
    stop_grace_period: 30s

volumes:
  pgdata:
